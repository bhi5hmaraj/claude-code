<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent Platformer Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 70%, #90EE90 70%, #90EE90 100%);
            font-family: 'Courier New', monospace;
        }

        #gameCanvas {
            border: 4px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            background: #87CEEB;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            max-width: 800px;
        }

        .agent-badge {
            display: inline-block;
            padding: 3px 8px;
            margin: 2px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .agent-engine { background: #FFD700; color: #333; }
        .agent-physics { background: #FF6B6B; color: white; }
        .agent-input { background: #4ECDC4; color: white; }
        .agent-player { background: #95E1D3; color: #333; }
        .agent-level { background: #A8E6CF; color: #333; }
        .agent-graphics { background: #FFB6C1; color: #333; }

        h3 { margin-top: 0; color: #333; }
        p { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>🎮 Multi-Agent Platformer</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="info">
        <h3>Built by Multi-Agent System with Beads</h3>
        <p>
            <span class="agent-badge agent-engine">Engine</span>
            <span class="agent-badge agent-physics">Physics</span>
            <span class="agent-badge agent-input">Input</span>
            <span class="agent-badge agent-player">Player</span>
            <span class="agent-badge agent-level">Levels</span>
            <span class="agent-badge agent-graphics">Graphics</span>
        </p>
        <p><strong>Controls:</strong> Arrow Keys / WASD to move, Spacebar to jump</p>
        <p><strong>Goal:</strong> Reach the flag on the right!</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
